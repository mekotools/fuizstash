name: Abbild bauen und nach GHCR schieben

on:
  push:
    branches: [main]
  workflow_dispatch:

# Das Arbeitsabbild ist absichtlich schlank (docker:27-cli, Alpine): docker, buildx
# und git sind drin, bash und node nicht. Deshalb:
#  * ausdrücklich sh als Schale
#  * Quelltext per git holen statt mit actions/checkout (das braucht node)
defaults:
  run:
    shell: sh

env:
  ABBILD: ghcr.io/mekotools/fuizstash

jobs:
  abbild:
    # Läuft auf dem eigenen Läufer (flip-01), Etikett "docker".
    runs-on: docker
    steps:
      - name: Quelle holen
        run: |
          git config --global --add safe.directory '*'
          git clone --quiet "${{ github.server_url }}/${{ github.repository }}.git" . || \
            git clone --quiet "${{ github.repository }}.git" .
          git checkout --quiet "${{ github.sha }}"
          git log --oneline -1
          ls -la

      - name: An GHCR anmelden
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "${{ secrets.GHCR_BENUTZER }}" --password-stdin

      - name: Bauen (Fassung = Übergabe-Kennung)
        run: |
          docker build \
            -t "$ABBILD:${{ github.sha }}" \
            -t "$ABBILD:latest" \
            -f Dockerfile .

      - name: Schieben
        run: docker push --all-tags "$ABBILD"

      - name: Nachweis
        run: |
          docker image inspect "$ABBILD:latest" --format 'Abbild {{.Id}} · Größe {{.Size}} Bytes'
          docker run --rm "$ABBILD:latest" python -c "import app.main; print('Anwendung importierbar')"
