# Schieber vor fuiz: hängt nur ein Zusatzskript ein. Die digest-genagelten
# fuiz-Abbilder bleiben unangetastet.
#
# Dieser Behälter sitzt für die Adressen fuiz.mekotools.de / fuiz.app.n0ne.de im Weg
# — ausgenommen /api (Spielserver, samt WebSocket) und /corkboard (Bildspeicher).
# Fällt er aus, verschwinden seine Traefik-Kennzeichnungen und der Verkehr läuft
# wieder unmittelbar zum fuiz-Behälter.

server {
    listen 8080;
    server_name _;

    # Das Zusatzskript selbst ausliefern (gleiche Herkunft wie die Seite).
    location = /mekotools-zusatz.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://mekotools-fuiz-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # Ohne diese Zeile kommt die Seite gepackt an und der Text lässt sich
        # nicht ersetzen. (sub_filter arbeitet nur an ungepackten Antworten.)
        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_read_timeout 300s;

        sub_filter '</body>' '<script src="/mekotools-zusatz.js" defer></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
